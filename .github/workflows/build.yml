name: Build Static Web Files

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Linux avoids Windows permission issues

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove broken private package
        run: |
          # Remove the missing package from package.json
          if grep -q "@openlovable-sh/supabase-management-js" package.json; then
            echo "Removing broken dependency..."
            sed -i '/"@openlovable-sh\/supabase-management-js"/d' package.json
          fi
          # Also remove from package-lock.json if it exists
          if [ -f package-lock.json ]; then
            sed -i '/"@openlovable-sh\/supabase-management-js"/d' package-lock.json
          fi

      - name: Install dependencies (ignore engines and scripts)
        run: |
          npm install --ignore-engines --ignore-scripts --no-audit --no-fund

      - name: Build static assets
        run: |
          npm run build || npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
