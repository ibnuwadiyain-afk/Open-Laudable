name: Build Static Web Files

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Linux avoids Windows permission issues

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove broken private package
        run: |
          # Remove from package.json
          sed -i '/"@openlovable-sh\/supabase-management-js"/d' package.json
          # Optionally, remove the lockfile so npm install regenerates it cleanly
          rm -f package-lock.json

      - name: Remove engine restrictions (optional but safe)
        run: |
          sed -i '/"engines": {/,/}/d' package.json

      - name: Install dependencies (regenerates lockfile)
        run: |
          npm install --ignore-scripts --no-audit --no-fund

      - name: Build static assets with Vite
        run: |
          # Try the original build, but fallback to direct Vite build if it fails
          npm run build || npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
