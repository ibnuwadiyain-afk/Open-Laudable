name: Build Static Web Files

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove broken private package
        run: |
          sed -i '/"@openlovable-sh\/supabase-management-js"/d' package.json
          if [ -f package-lock.json ]; then
            sed -i '/"@openlovable-sh\/supabase-management-js"/d' package-lock.json
          fi

      - name: Relax engine requirements
        run: |
          sed -i '/"engines": {/,/}/d' package.json

      - name: Install dependencies (skip scripts)
        run: |
          npm install --ignore-scripts --no-audit --no-fund

      - name: Create stub for missing package
        run: |
          # Create a dummy module to satisfy the import
          mkdir -p src/supabase_admin
          echo "export default {};" > src/supabase_admin/supabase_management_client.d.ts
          # Actually, we need to override the import. We'll create a mock file.
          echo "export const createSupabaseManagementClient = () => ({});" > src/supabase_admin/supabase_management_client.js
          # Also remove the line that imports it (or we can use Vite alias)
          # Easiest: replace the import with a stub in the source
          find src -type f -name "*.ts" -o -name "*.tsx" | xargs sed -i 's/import.*@openlovable-sh\/supabase-management-js.*/\/\/ removed imported stub/g'

      - name: Ensure path alias resolution
        run: |
          # Create a Vite config that resolves '@' to 'src'
          cat > vite.config.web.js << 'EOF'
          import { defineConfig } from 'vite';
          import react from '@vitejs/plugin-react';
          import path from 'path';
          export default defineConfig({
            plugins: [react()],
            resolve: {
              alias: {
                '@': path.resolve(__dirname, './src'),
              },
            },
            build: {
              outDir: 'dist',
              emptyOutDir: true,
            },
          });
          EOF

      - name: Build static assets with Vite
        run: |
          npx vite build --config vite.config.web.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
