name: Build Static Web Files

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove broken private package
        run: |
          sed -i '/"@openlovable-sh\/supabase-management-js"/d' package.json
          if [ -f package-lock.json ]; then
            sed -i '/"@openlovable-sh\/supabase-management-js"/d' package-lock.json
          fi

      - name: Relax engine requirements
        run: |
          # Remove the entire "engines" block to bypass version checks
          sed -i '/"engines": {/,/}/d' package.json
          # Alternatively, change npm requirement to ">=10" (uncomment next line if preferred)
          # sed -i 's/"npm": "11.8.0"/"npm": ">=10"/g' package.json

      - name: Install dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund

      - name: Build static assets
        run: |
          npm run build || npx vite build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
