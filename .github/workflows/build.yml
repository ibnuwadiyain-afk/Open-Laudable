name: Build Static Files

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest  # Use Linux to avoid Windows permission issues
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove broken private package
        run: |
          # Remove the missing package from package.json
          if grep -q "@openlovable-sh/supabase-management-js" package.json; then
            echo "Removing broken dependency..."
            sed -i '/"@openlovable-sh\/supabase-management-js"/d' package.json
          fi

      - name: Install dependencies
        run: |
          npm install --no-audit --no-fund --ignore-scripts

      - name: Build the static web app
        run: |
          npm run build || npx vite build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
